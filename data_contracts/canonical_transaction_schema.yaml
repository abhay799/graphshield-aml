dataset:
  name: graphshield_transactions
  layer: silver
  version: 1

source:
  dataset: IBM AML LI-Small
  file: LI-Small_Trans.csv
  synthetic: true

columns:

  transaction_id:
    type: string
    nullable: false
    description: GraphShield-generated transaction identifier

  event_ts:
    type: datetime
    nullable: false
    source: Timestamp

  from_bank:
    type: string
    source: From Bank
    description: Sending bank identifier

  from_account:
    type: string
    source: Account
    description: Sending account identifier

  to_bank:
    type: string
    source: To Bank
    description: Receiving bank identifier

  to_account:
    type: string
    source: Account_duplicated_0
    description: Receiving account identifier

  amount_received:
    type: float64
    source: Amount Received

  receiving_currency:
    type: string
    source: Receiving Currency

  amount_paid:
    type: float64
    source: Amount Paid

  payment_currency:
    type: string
    source: Payment Currency

  payment_format:
    type: string
    source: Payment Format

  is_laundering:
    type: uint8
    source: Is Laundering
    role: target
    allowed_values:
      - 0
      - 1

  source_row_number:
    type: uint64
    description: Original row position used for lineage

  source_dataset:
    type: string
    description: Dataset from which this transaction originated