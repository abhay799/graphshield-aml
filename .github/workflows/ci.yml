name: GraphShield AML CI

on:
  push:
    branches: [master, main, graphshield-v2]
  pull_request:
    branches: [master, main, graphshield-v2]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt
          python -m pip install -r requirements-ml.txt
          python -m pip install pytest

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Validate Python syntax
        run: |
          python -m py_compile src/api/app.py
          python -m py_compile src/api/observability.py
          python -m py_compile src/services/graphshield_service.py
          python -m py_compile src/services/case_intelligence.py

      - name: Validate repository safety
        run: |
          test ! -f .env
          test ! -d .venv
          echo 'Repository safety checks passed'

      - name: Validate Docker Compose
        run: docker compose config

      - name: Run tests
        run: python -m pytest -q

      - name: CI summary
        run: echo 'GraphShield AML CI validation passed'
