apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: graphshield-api
  namespace: graphshield
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: graphshield-api
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
